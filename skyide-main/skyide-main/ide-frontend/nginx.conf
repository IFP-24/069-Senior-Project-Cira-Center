# SkyIDE frontend — static SPA + reverse proxy to the Flask backend.
# The SPA is built with VITE_API_BASE_URL=/api, so all API calls are same-origin
# and nginx forwards them to the backend container. No CORS needed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker's embedded DNS. Re-resolve the backend container IP on a short TTL so an
    # nginx worker started before the backend — or surviving a backend restart on a
    # shared network (e.g. behind Traefik on ct03) — does NOT pin a stale upstream IP
    # and 502 forever. Pairs with the variable proxy_pass in `location /api`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container liveness for the Docker HEALTHCHECK — local to nginx, not proxied.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API surface → Flask. Covers /api/auth/* (accounts/projects) and /api/v1/* (games).
    location /api {
        # Variable proxy_pass forces per-request DNS re-resolution via the resolver
        # above (a literal upstream name is resolved once at worker startup and cached
        # for the worker's life). Host part = the compose service name `skyide-backend`.
        set $skyide_backend http://skyide-backend:5055;
        proxy_pass $skyide_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Standalone BlockMirror page (Vite serves this outside React Router in dev).
    location = /blockmirror {
        try_files /blockmirror.html /blockmirror/index.html /index.html;
    }

    # Fingerprinted static assets — long cache.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
